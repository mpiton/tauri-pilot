[workspace]
resolver = "2"
members = ["crates/tauri-plugin-pilot", "crates/tauri-pilot-cli"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95.0"
authors = ["Mathieu Piton <contact@mathieu-piton.com>"]
repository = "https://github.com/mpiton/tauri-pilot"
homepage = "https://github.com/mpiton/tauri-pilot"

[workspace.dependencies]
serde = { version = "1.0.225", features = ["derive"] }
tauri = { version = "2.11.3" }
serde_json = "1.0.127"
# 1.44 is where a watched CTRL_CLOSE or CTRL_SHUTDOWN stops killing the
# process before the watcher runs (tokio #7122), which #229 relies on.
tokio = { version = "1.44" }
tracing = "0.1.41"

[workspace.lints.clippy]
unwrap_used = "deny"
pedantic = { level = "warn", priority = -1 }
