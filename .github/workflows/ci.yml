name: CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'crates/tauri-plugin-pilot/js/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'crates/tauri-plugin-pilot/js/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          # Intentionally exclude `~/.cargo/bin/`: the toolchain action above
          # provisions cargo/rustc/clippy/rustfmt, and caching the bin dir
          # restores stale `rustup-init`-targeted symlinks that break
          # `cargo clippy` on subsequent runs (see #94).
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          # `Cargo.lock` is gitignored, so we key on the workspace `Cargo.toml`
          # files. Bumped `v2` to invalidate the poisoned cache.
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Check Android plugin
        if: runner.os == 'Linux'
        run: |
          rustup target add aarch64-linux-android
          cargo check -p tauri-plugin-pilot --target aarch64-linux-android --no-default-features
          cargo clippy -p tauri-plugin-pilot --target aarch64-linux-android --no-default-features -- -D warnings

      - name: Check iOS plugin
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios-sim
          cargo check -p tauri-plugin-pilot --target aarch64-apple-ios-sim --no-default-features
          cargo clippy -p tauri-plugin-pilot --target aarch64-apple-ios-sim --no-default-features -- -D warnings

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Release builds reduce the plugin to a no-op `init`: any module still
      # compiled there is dead code (#164). Turning debug assertions off for
      # the plugin alone lints it as release compiles it, and reuses the
      # dependencies the Clippy step above already checked.
      - name: Clippy plugin (debug assertions off)
        run: cargo clippy --workspace --all-targets --config 'profile.dev.package.tauri-plugin-pilot.debug-assertions=false' -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The injected bridge ships as plain JS with its own node:test suite.
      # `node --test <dir>` cannot resolve the files, so pass the glob.
      - name: Test JS bridge
        if: runner.os == 'Linux'
        run: node --test 'crates/tauri-plugin-pilot/js/*.test.mjs'

      - name: Check formatting
        run: cargo fmt --all -- --check

  # `Cargo.lock` is gitignored, so `check` always resolves the newest versions
  # and never sees the floors `Cargo.toml` declares. This job does: it resolves
  # direct dependencies to the lowest versions the manifests allow, which is
  # what a consumer with an old lockfile can end up with (#210, #221).
  # Purely transitive crates stay at their newest, so a bad floor in a manifest
  # nothing of ours depends on directly cannot turn it red. A direct dependency
  # is not shielded, though: a new upstream release can fail against the floor
  # we declare for a crate it shares with us (`rmcp` needed `tokio` 1.37), and
  # the fix is to raise our floor for that crate. When it fails, raise the floor
  # cargo or rustc names. Same matrix as `check`: `image`, `core-graphics`,
  # `core-foundation` and `windows` are platform-gated and only compile there.
  minimal-versions:
    name: Direct minimal versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # `-Z direct-minimal-versions` is unstable and this job gates every merge,
      # so the resolver toolchain is pinned: a rolling nightly could go red on a
      # regression that has nothing to do with our floors. Bump deliberately.
      NIGHTLY: nightly-2026-09-01
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust nightly (resolver only)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"

      # Own key: `actions/cache` never overwrites an existing one, so sharing
      # `check`'s would let whichever job saves first decide what the other
      # restores. `Cargo.lock` is not a cached path, so the floors resolved
      # here cannot reach `check` either way.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-minimal-v1-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-minimal-v1-

      - name: Resolve direct dependencies to their floors
        run: cargo +${{ env.NIGHTLY }} update -Z direct-minimal-versions

      - name: Check
        run: cargo +1.95.0 check --workspace --all-targets --locked

  ci:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [check, minimal-versions]
    if: always()
    steps:
      # Keyed off the whole `needs` context rather than one variable per job:
      # a new required job then only has to be added to `needs` above, and
      # forgetting a variable can no longer leave this green on a red job.
      - name: Verify job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required job did not succeed:"
          echo "$RESULTS"
          exit 1
