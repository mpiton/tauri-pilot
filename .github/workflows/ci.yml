name: CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'crates/tauri-plugin-pilot/js/**'
      - '.github/workflows/*.yml'
      - 'scripts/msrv.sh'
      - 'scripts/msrv.test.sh'
      # The docs `scripts/msrv.sh --check` reads: a version edited there must
      # reach the guard in the PR that edits it.
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/src/content/docs/contributing.md'
      - 'docs/src/content/docs/getting-started.md'
  pull_request:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'crates/tauri-plugin-pilot/js/**'
      - '.github/workflows/*.yml'
      - 'scripts/msrv.sh'
      - 'scripts/msrv.test.sh'
      # The docs `scripts/msrv.sh --check` reads: a version edited there must
      # reach the guard in the PR that edits it.
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/src/content/docs/contributing.md'
      - 'docs/src/content/docs/getting-started.md'
  # `check` and the release workflow use rolling stable, and the triggers above
  # only fire when a matching file changes. Without a timer, a new stable could
  # first meet `-D warnings` in the release workflow, after the tag is pushed.
  # Stable ships on Thursdays: this runs `main` the morning after, and ignores
  # the path filters. Before tagging, `workflow_dispatch` runs it on demand.
  schedule:
    - cron: '17 5 * * 5'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The MSRV is `rust-version` in the root `Cargo.toml` and nowhere else. This
  # job hands it to the two jobs that build on it, and fails when a copy has
  # drifted: a doc quoting another version, or a workflow that hard-codes a
  # toolchain number instead of reading it here.
  rust-version:
    name: MSRV in sync
    runs-on: ubuntu-latest
    outputs:
      msrv: ${{ steps.read.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the docs and workflows against Cargo.toml
        run: scripts/msrv.sh --check

      # The guard is the only thing that keeps a second copy of the MSRV out
      # of the workflows, so its own cases run wherever it does.
      - name: Test the guard
        run: scripts/msrv.test.sh

      - name: Read the MSRV
        id: read
        run: |
          msrv="$(scripts/msrv.sh)"
          echo "msrv=$msrv" >> "$GITHUB_OUTPUT"

  # Lint and test on current stable, so new lints and compiler fixes reach us
  # when they ship instead of when the MSRV moves. `stable` rolls on purpose: a
  # pinned number is one more version to bump by hand, and it ages silently.
  # The cost is that a new release can turn this red on untouched code; the fix
  # is then the lint, not a pin. The `msrv` job below keeps users on the MSRV covered.
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust stable
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          # Intentionally exclude `~/.cargo/bin/`: the toolchain action above
          # provisions cargo/rustc/clippy/rustfmt, and caching the bin dir
          # restores stale `rustup-init`-targeted symlinks that break
          # `cargo clippy` on subsequent runs (see #94).
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          # `Cargo.lock` is gitignored, so we key on the workspace `Cargo.toml`
          # files. Bumped `v2` to invalidate the poisoned cache. The rustc
          # build is in the key too: `stable` rolls, and `actions/cache` never
          # overwrites a key, so without it every run after a release would
          # restore the previous compiler's `target/` and rebuild from scratch.
          key: ${{ runner.os }}-cargo-v2-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-${{ steps.toolchain.outputs.cachekey }}-

      # Lint mobile with and without the `press` feature. The default build is
      # the one #256 fixed, and no other step compiles it for mobile.
      - name: Check Android plugin
        if: runner.os == 'Linux'
        run: |
          rustup target add aarch64-linux-android
          cargo check -p tauri-plugin-pilot --target aarch64-linux-android --no-default-features
          cargo clippy -p tauri-plugin-pilot --target aarch64-linux-android --no-default-features -- -D warnings
          cargo clippy -p tauri-plugin-pilot --target aarch64-linux-android -- -D warnings

      - name: Check iOS plugin
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios-sim
          cargo check -p tauri-plugin-pilot --target aarch64-apple-ios-sim --no-default-features
          cargo clippy -p tauri-plugin-pilot --target aarch64-apple-ios-sim --no-default-features -- -D warnings
          cargo clippy -p tauri-plugin-pilot --target aarch64-apple-ios-sim -- -D warnings

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Release builds reduce the plugin to a no-op `init`: any module still
      # compiled there is dead code (#164). Turning debug assertions off for
      # the plugin alone lints it as release compiles it, and reuses the
      # dependencies the Clippy step above already checked.
      - name: Clippy plugin (debug assertions off)
        run: cargo clippy --workspace --all-targets --config 'profile.dev.package.tauri-plugin-pilot.debug-assertions=false' -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The injected bridge ships as plain JS with its own node:test suite.
      # `node --test <dir>` cannot resolve the files, so pass the glob.
      # Pin Node rather than use the runner image's default, which lags.
      - name: Install Node 26
        if: runner.os == 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Test JS bridge
        if: runner.os == 'Linux'
        run: node --test 'crates/tauri-plugin-pilot/js/*.test.mjs'

      - name: Check formatting
        run: cargo fmt --all -- --check

  # `check` runs on stable, so nothing there proves the `rust-version` we
  # publish. This job does: same newest dependencies as `check`, compiled with
  # the MSRV itself. `minimal-versions` below also builds on the MSRV, but
  # against the dependency floors, so it cannot see a new release of a
  # dependency that needs a newer compiler than ours, which is what a fresh
  # `cargo install` or `cargo add` resolves to. Same matrix as `check`: the
  # platform-gated crates only compile on their own OS. When it fails on our
  # code, an API newer than the MSRV slipped in: replace it, or raise
  # `rust-version` deliberately.
  msrv:
    name: MSRV
    needs: rust-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MSRV: ${{ needs.rust-version.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust ${{ env.MSRV }} (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      # Own key, for the reason `minimal-versions` gives below. Downloads
      # only, no `target/`: this job runs one `cargo check`, and its `target/`
      # was a third of a gigabyte per OS in a repository cache capped at 10 GB,
      # where an eviction costs `check` a cold build. `v2` so that a `v1`
      # archive, which carries `target/`, is never restored.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: ${{ runner.os }}-cargo-msrv-v2-${{ env.MSRV }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-v2-${{ env.MSRV }}-

      - name: Check
        run: cargo +${{ env.MSRV }} check --workspace --all-targets

  # `Cargo.lock` is gitignored, so `check` always resolves the newest versions
  # and never sees the floors `Cargo.toml` declares. This job does: it resolves
  # direct dependencies to the lowest versions the manifests allow, which is
  # what a consumer with an old lockfile can end up with (#210, #221).
  # Purely transitive crates stay at their newest, so a bad floor in a manifest
  # nothing of ours depends on directly cannot turn it red. A direct dependency
  # is not shielded, though: a new upstream release can fail against the floor
  # we declare for a crate it shares with us (`rmcp` needed `tokio` 1.37), and
  # the fix is to raise our floor for that crate. When it fails, raise the floor
  # cargo or rustc names. Same matrix as `check`: `image`, `core-graphics`,
  # `core-foundation` and `windows` are platform-gated and only compile there.
  minimal-versions:
    name: Direct minimal versions
    needs: rust-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # `-Z direct-minimal-versions` is unstable and this job gates every merge,
      # so the resolver toolchain is pinned: a rolling nightly could go red on a
      # regression that has nothing to do with our floors. Bump deliberately.
      NIGHTLY: nightly-2026-11-13
      MSRV: ${{ needs.rust-version.outputs.msrv }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust nightly (resolver only)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}

      # On the MSRV rather than stable: the floors are what a consumer on an
      # old toolchain with an old lockfile builds, so this is the oldest
      # compiler against the oldest dependencies.
      - name: Install Rust ${{ env.MSRV }} (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      # Own key: `actions/cache` never overwrites an existing one, so sharing
      # `check`'s would let whichever job saves first decide what the other
      # restores. `Cargo.lock` is not a cached path, so the floors resolved
      # here cannot reach `check` either way.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-minimal-v1-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-minimal-v1-

      - name: Resolve direct dependencies to their floors
        run: cargo +${{ env.NIGHTLY }} update -Z direct-minimal-versions

      - name: Check
        run: cargo +${{ env.MSRV }} check --workspace --all-targets --locked

  ci:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [rust-version, check, msrv, minimal-versions]
    if: always()
    steps:
      # Keyed off the whole `needs` context rather than one variable per job:
      # a new required job then only has to be added to `needs` above, and
      # forgetting a variable can no longer leave this green on a red job.
      - name: Verify job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "A required job did not succeed:"
          echo "$RESULTS"
          exit 1
